# socialz production stack — isolated from the host's other Docker projects.
#
# Segmentation model:
#   - app / data networks: internal:true, no route to the internet.
#   - edge / egress: carry the Caddy<->cloudflared path in and cloudflared's
#     outbound connection to Cloudflare out. No ports are published on any
#     service — the tunnel is the only way in.
#   - app-egress: NOT internal. The only outbound-internet path for the app
#     container itself, needed to reach social platform APIs, OAuth
#     endpoints, and outbound email. Only `app` is attached to it — never
#     cloudflared's `egress` network, and never postgres/redis/temporal,
#     which all stay internal-only with no route to the internet.
#   - All state lives on the dedicated /srv/socialz-state LV (Postgres,
#     Redis, Temporal's Postgres, Elasticsearch, app config) or the
#     zpool_media/socialz ZFS dataset (uploaded media). No named Docker
#     volumes.
#   - Secrets are files under /etc/socialz/secrets/, mounted read-only via
#     Compose `secrets:`, never plaintext environment values.
#
name: socialz

networks:
  app:
    internal: true
  data:
    internal: true
  edge: {}
  egress: {}
  app-egress: {}

secrets:
  postgres_password:
    file: /etc/socialz/secrets/postgres_password
  redis_password:
    file: /etc/socialz/secrets/redis_password
  jwt_secret:
    file: /etc/socialz/secrets/jwt_secret
  database_url:
    file: /etc/socialz/secrets/database_url
  cloudflare_tunnel_token:
    file: /etc/socialz/secrets/cloudflare_tunnel_token

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_VERSION: v2.23.0-141-gb38c43fa
    container_name: socialz-app
    restart: unless-stopped
    networks: [app, data, app-egress]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    secrets: [database_url, redis_password, jwt_secret]
    environment:
      MAIN_URL: 'https://socialz.mpsolara.com'
      FRONTEND_URL: 'https://socialz.mpsolara.com'
      NEXT_PUBLIC_BACKEND_URL: 'https://socialz.mpsolara.com/api'
      BACKEND_INTERNAL_URL: 'http://localhost:3000'
      TEMPORAL_ADDRESS: 'temporal:7233'
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: 'false'
      STORAGE_PROVIDER: 'local'
      UPLOAD_DIRECTORY: '/uploads'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '/uploads'
      NX_ADD_PLUGINS: 'false'
    entrypoint:
      - sh
      - -c
      - |
        export DATABASE_URL="$$(cat /run/secrets/database_url)"
        export REDIS_URL="redis://:$$(cat /run/secrets/redis_password)@redis:6379"
        export JWT_SECRET="$$(cat /run/secrets/jwt_secret)"
        mkdir -p /config/node-reports
        exec sh -c 'nginx && pnpm run pm2'
    volumes:
      - /srv/socialz-state/config:/config
      - /zpool_media/socialz:/uploads
    healthcheck:
      # Visibility only — nothing auto-restarts on unhealthy yet (no
      # autoheal sidecar, no docker.sock mount). Backend listens on
      # :3000 internally (nginx on :5000 proxies /api to it); a bare TCP
      # connect is enough to catch the exact 2026-09-15/16 failure mode,
      # where the port never opens at all. wget/curl/nc are not in this
      # image (verified), hence the node one-liner.
      test: ["CMD", "node", "-e", "require('net').createConnection({host:'127.0.0.1',port:3000},()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Keep in sync with BACKEND_STARTUP_TIMEOUT_MS's default (45s) in
      # apps/backend/startup-watchdog.preload.js. start_period covers the
      # container's whole life, not each pm2 restart inside it, so a
      # single-attempt start_period would start counting unhealthy
      # retries against a legitimate multi-attempt boot (the 2026-09-16
      # incident took 2 failed watchdog-timeout cycles before a 3rd
      # attempt succeeded). Sized for 2 failed 45s attempts + a healthy
      # ~5s boot, rounded up.
      start_period: 120s

  postgres:
    image: postgres:17-alpine
    container_name: socialz-postgres
    restart: unless-stopped
    networks: [data]
    environment:
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - /srv/socialz-state/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postiz-user -d postiz-db']
      interval: 10s
      timeout: 3s
      retries: 3

  redis:
    image: redis:7.2
    container_name: socialz-redis
    restart: unless-stopped
    networks: [data]
    secrets: [redis_password]
    command: sh -c 'exec redis-server --requirepass "$$(cat /run/secrets/redis_password)"'
    volumes:
      - /srv/socialz-state/redis:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$(cat /run/secrets/redis_password)" ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2.11.4-alpine
    container_name: socialz-caddy
    restart: unless-stopped
    networks: [edge, app]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [app]

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    container_name: socialz-cloudflared
    restart: unless-stopped
    networks: [egress, edge]
    secrets: [cloudflare_tunnel_token]
    command: ['tunnel', 'run', '--token-file', '/run/secrets/cloudflare_tunnel_token']

  # -----------------------
  # Temporal (required at app boot — see libraries/nestjs-libraries/src/temporal/)
  # -----------------------
  temporal-elasticsearch:
    container_name: socialz-temporal-elasticsearch
    image: elasticsearch:7.17.27
    restart: unless-stopped
    networks: [data]
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
    volumes:
      - /srv/socialz-state/elasticsearch:/usr/share/elasticsearch/data

  temporal-postgresql:
    container_name: socialz-temporal-postgresql
    image: postgres:16
    restart: unless-stopped
    networks: [data]
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    volumes:
      - /srv/socialz-state/temporal-postgres:/var/lib/postgresql/data

  temporal:
    container_name: socialz-temporal
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    networks: [data]
    depends_on:
      - temporal-postgresql
      - temporal-elasticsearch
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      # tctl ships in this image (verified: /usr/local/bin/tctl in
      # temporalio/auto-setup:1.28.1) and `cluster health` calls the
      # frontend service's real gRPC health-checking endpoint, so it
      # confirms Temporal is actually SERVING — not just that port 7233
      # is open. A bare TCP probe would pass the instant the port starts
      # listening, before the frontend service inside is ready, which is
      # exactly the boot-race this healthcheck exists to close (see
      # ticket #10 / docs/STREAM_TRACKER.md row 10).
      test: ['CMD', 'tctl', '--address', 'temporal:7233', 'cluster', 'health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-ui:
    container_name: socialz-temporal-ui
    image: temporalio/ui:2.34.0
    restart: unless-stopped
    networks: [data]
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=https://socialz.mpsolara.com
    # No published port, by design (see project segmentation rules). Reach
    # it for ops by SSHing to the host — which sits directly on the `data`
    # bridge and can route to it even though the network is internal — and
    # forwarding a local port to this container's address:
    #   docker inspect -f '{{.NetworkSettings.Networks.socialz_data.IPAddress}}' socialz-temporal-ui
    #   ssh -L 8080:<that-ip>:8080 <host>
