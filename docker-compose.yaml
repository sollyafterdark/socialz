# socialz production stack — isolated from the host's other Docker projects.
#
# Segmentation model:
#   - app / data networks: internal:true, no route to the internet.
#   - edge / egress: carry the Caddy<->cloudflared path in and cloudflared's
#     outbound connection to Cloudflare out. No ports are published on any
#     service — the tunnel is the only way in.
#   - All state lives on the dedicated /srv/socialz-state LV (Postgres,
#     Redis, Temporal's Postgres, Elasticsearch, app config) or the
#     zpool_media/socialz ZFS dataset (uploaded media). No named Docker
#     volumes.
#   - Secrets are files under /etc/socialz/secrets/, mounted read-only via
#     Compose `secrets:`, never plaintext environment values.
#
# Project name resolves to "socialz" by default from this directory's name;
# pin it explicitly with a local (gitignored) .env containing
# COMPOSE_PROJECT_NAME=socialz if deploying from a differently-named path.

networks:
  app:
    internal: true
  data:
    internal: true
  edge: {}
  egress: {}

secrets:
  postgres_password:
    file: /etc/socialz/secrets/postgres_password
  redis_password:
    file: /etc/socialz/secrets/redis_password
  jwt_secret:
    file: /etc/socialz/secrets/jwt_secret
  database_url:
    file: /etc/socialz/secrets/database_url
  cloudflare_tunnel_token:
    file: /etc/socialz/secrets/cloudflare_tunnel_token

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_VERSION: v2.23.0-141-gb38c43fa
    container_name: socialz-app
    restart: unless-stopped
    networks: [app, data]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    secrets: [database_url, redis_password, jwt_secret]
    environment:
      MAIN_URL: 'https://socialz.mpsolara.com'
      FRONTEND_URL: 'https://socialz.mpsolara.com'
      NEXT_PUBLIC_BACKEND_URL: 'https://socialz.mpsolara.com/api'
      BACKEND_INTERNAL_URL: 'http://localhost:3000'
      TEMPORAL_ADDRESS: 'temporal:7233'
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: 'false'
      STORAGE_PROVIDER: 'local'
      UPLOAD_DIRECTORY: '/uploads'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '/uploads'
      NX_ADD_PLUGINS: 'false'
    entrypoint:
      - sh
      - -c
      - |
        export DATABASE_URL="$$(cat /run/secrets/database_url)"
        export REDIS_URL="redis://:$$(cat /run/secrets/redis_password)@redis:6379"
        export JWT_SECRET="$$(cat /run/secrets/jwt_secret)"
        exec sh -c 'nginx && pnpm run pm2'
    volumes:
      - /srv/socialz-state/config:/config
      - /zpool_media/socialz:/uploads

  postgres:
    image: postgres:17-alpine
    container_name: socialz-postgres
    restart: unless-stopped
    networks: [data]
    environment:
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - /srv/socialz-state/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postiz-user -d postiz-db']
      interval: 10s
      timeout: 3s
      retries: 3

  redis:
    image: redis:7.2
    container_name: socialz-redis
    restart: unless-stopped
    networks: [data]
    secrets: [redis_password]
    command: sh -c 'exec redis-server --requirepass "$$(cat /run/secrets/redis_password)"'
    volumes:
      - /srv/socialz-state/redis:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$(cat /run/secrets/redis_password)" ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: socialz-caddy
    restart: unless-stopped
    networks: [edge, app]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [app]

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: socialz-cloudflared
    restart: unless-stopped
    networks: [egress, edge]
    secrets: [cloudflare_tunnel_token]
    command: sh -c 'exec cloudflared tunnel run --token "$$(cat /run/secrets/cloudflare_tunnel_token)"'

  # -----------------------
  # Temporal (required at app boot — see libraries/nestjs-libraries/src/temporal/)
  # -----------------------
  temporal-elasticsearch:
    container_name: socialz-temporal-elasticsearch
    image: elasticsearch:7.17.27
    restart: unless-stopped
    networks: [data]
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
    volumes:
      - /srv/socialz-state/elasticsearch:/usr/share/elasticsearch/data

  temporal-postgresql:
    container_name: socialz-temporal-postgresql
    image: postgres:16
    restart: unless-stopped
    networks: [data]
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    volumes:
      - /srv/socialz-state/temporal-postgres:/var/lib/postgresql/data

  temporal:
    container_name: socialz-temporal
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    networks: [data]
    depends_on:
      - temporal-postgresql
      - temporal-elasticsearch
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig

  temporal-ui:
    container_name: socialz-temporal-ui
    image: temporalio/ui:2.34.0
    restart: unless-stopped
    networks: [data]
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=https://socialz.mpsolara.com
    # No published port, by design (see project segmentation rules). Reach
    # it for ops by SSHing to the host — which sits directly on the `data`
    # bridge and can route to it even though the network is internal — and
    # forwarding a local port to this container's address:
    #   docker inspect -f '{{.NetworkSettings.Networks.socialz_data.IPAddress}}' socialz-temporal-ui
    #   ssh -L 8080:<that-ip>:8080 <host>
